<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="DLP — AI Data Lake Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#0A1E3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0" stop-color="#13C2C2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#13C2C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(90,150)">
    <text x="0" y="70" font-family="Inter,sans-serif" font-weight="700" font-size="88" letter-spacing="-3" fill="#ffffff">D</text>
    <rect x="62" y="52" width="18" height="18" rx="4" fill="#13C2C2"/>
    <text x="92" y="70" font-family="Inter,sans-serif" font-weight="700" font-size="88" letter-spacing="-3" fill="#ffffff">LP</text>
    <text x="0" y="108" font-family="JetBrains Mono,monospace" font-size="22" letter-spacing="4" fill="rgba(255,255,255,0.55)">AI DATA LAKE PLATFORM</text>
  </g>

  <!-- tagline -->
  <text x="90" y="400" font-family="Inter,sans-serif" font-weight="700" font-size="52" fill="#ffffff">Данные бизнеса → дашборды</text>
  <text x="90" y="464" font-family="Inter,sans-serif" font-weight="700" font-size="52" fill="#ffffff">и AI-инсайты за <tspan fill="#13C2C2">2 часа</tspan></text>

  <!-- foot -->
  <text x="90" y="560" font-family="JetBrains Mono,monospace" font-size="22" fill="rgba(255,255,255,0.6)">// AI Data Engineer · LLM Router · Zero Cross-Tenant</text>
  <rect x="90" y="585" width="44" height="3" fill="#FFC53D"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Datasulus — Icon on Deep Navy background (rounded square)
  Use case: app icon (iOS/Android), large favicon, social avatar (LinkedIn/X)

  Background: Deep Navy #0B2545 with rounded corners (iOS-style)
  Symbol: 3×3 grid of dots in Insight Amber #FFC53D
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     role="img"
     aria-label="Datasulus app icon">

  <title>Datasulus app icon — Amber dot grid on Deep Navy</title>

  <!-- Rounded square background (iOS-style 23% corner radius) -->
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="#0B2545"/>

  <!-- 3×3 grid centered, ~50% of canvas -->
  <!-- Grid total: 256×256, dot diameter 56 (r=28), gap 44 -->
  <g transform="translate(128, 128)" fill="#FFC53D">
    <circle cx="28" cy="28" r="28"/>
    <circle cx="128" cy="28" r="28"/>
    <circle cx="228" cy="28" r="28"/>
    <circle cx="28" cy="128" r="28"/>
    <circle cx="128" cy="128" r="28"/>
    <circle cx="228" cy="128" r="28"/>
    <circle cx="28" cy="228" r="28"/>
    <circle cx="128" cy="228" r="28"/>
    <circle cx="228" cy="228" r="28"/>
  </g>
</svg>
